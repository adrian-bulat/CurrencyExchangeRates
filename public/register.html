<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exchange Rates</title>
        <link rel="stylesheet" href="css/register.css">
        <script src="js/register.js" defer></script>
    </head>
    <body>
        <header></header>
        <main>
            <div class="container">
                <h2>Registration</h2>
                <form id="registerForm" class="registration-form">

                    <div class="input-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>

                    <div class="input-group">
                        <label for="new-password">Password</label>
                        <input type="password" id="new-password" name="new-password" placeholder="Enter your password" autocomplete="new-password" required>
                    </div>

                    <div class="input-group">
                        <label for="password-confirmation">Password confirmation</label>
                        <input type="password" id="password-confirmation" name="password-confirmation" placeholder="Confirm Password" autocomplete="password-confirmation" required>
                    </div>

                    <button type="submit" class="btn">Register</button>

                    <div class="form-footer">
                        <span>Already have an account? <a href="/login">Log in</a></span>
                    </div>
                </form>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
